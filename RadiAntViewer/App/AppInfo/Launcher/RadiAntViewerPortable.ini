[Launch]
ProgramExecutable=RadiAntViewer\RadiAntViewer.exe
WorkingDirectory=%PAL:AppDir%\RadiAntViewer
SinglePortableAppInstance=true
DirectoryMoveOK=yes

[Activate]
Registry=true

[RegistryValueWrite]
HKCU\Software\RadiAnt Viewer\CheckUpdate=REG_DWORD:0

[RegistryKeys]
RadiAntViewer=HKCU\Software\RadiAnt Viewer
-=HKCU\Software\Microsoft\IntelliPoint\AppSpecific\RadiAntViewer.exe
-=HKCU\Software\Microsoft\IntelliType Pro\AppSpecific\RadiAntViewer.exe

[DirectoriesMove]
RadiantViewer=%ALLUSERSAPPDATA%\RadiantViewer
RadiAntDB=%USERPROFILE%\Documents\RadiAntDB
RadiAntLocal=%LOCALAPPDATA%\RadiantViewer
RadiAntUser=%APPDATA%\RadiantViewer
